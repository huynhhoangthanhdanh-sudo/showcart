<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập</title>
    <link rel="icon" href="../image/Anh2.jpg" type="image/x-icon" />
    <link rel="stylesheet" href="../CSS/log_in.css" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap");
    </style>
  </head>
  <body>
    <div class="signin-box">
      <p class="signin">Đăng nhập</p>
      <div class="typearea">
        <div class="usernamearea">
          <label class="username-description">Tên đăng nhập</label>
          <input
            id="username"
            class="username"
            type="text"
            maxlength="30"
            title="Tên đăng nhập"
            placeholder="Tên đăng nhập"
            required
          />
        </div>
        <div class="passwordarea">
          <label class="password-description">Mật khẩu</label>
          <input
            id="password"
            class="password"
            type="password"
            title="Mật khẩu"
            placeholder="Nhập mật khẩu"
            required
          />
        </div>
      </div>
      <button id="Signin" class="Signin">Đăng nhập</button>
      <p class="signin-box__direct">
        Chưa có tài khoản,
        <a class="signin-box__direct--link" href="register.html">Đăng kí</a>
      </p>
    </div>
    <script src="../JS/signin.js" defer></script>
  </body>
</html>
